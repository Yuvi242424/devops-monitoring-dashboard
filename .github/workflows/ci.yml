name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Formatting
        run: |
          black --check .

      - name: Lint Python Code
        run: |
          flake8 app --max-line-length=100

      - name: Run Unit Tests
        run: |
          pytest

      - name: Validate Flask Application
        run: |
          python -m py_compile app/app.py

      - name: Build Docker Image
        run: |
          docker build -t devops-monitoring-dashboard .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          IMAGE_NAME: ghcr.io/yuvi242424/devops-monitoring-dashboard:latest
        run: |
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Verify Published Image
        run: |
          echo "Docker image published successfully:"
          echo "$IMAGE_NAME"

      - name: CI Pipeline Completed
        run: |
          echo "=================================="
          echo "✅ CI Pipeline Completed"
          echo "✔ Formatting Passed"
          echo "✔ Linting Passed"
          echo "✔ Tests Passed"
          echo "✔ Flask Validation Passed"
          echo "✔ Docker Image Built"
          echo "✔ Docker Image Published"
          echo "=================================="